version: 2
updates:
  # The workflows reference actions by major version; this is what moves those
  # versions. The deploy workflow also holds `pages: write` and `id-token: write`,
  # so a bump here is worth reading rather than merging blind.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Development tooling only — ESLint, Playwright, axe, html-validate. None of it
  # ships: the page is static files with no build step. A bump is safe if the test
  # suite passes, which the pull-request checks verify.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dev-tooling:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
