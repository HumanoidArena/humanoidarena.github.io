# The page's value is that its artifacts are reachable, and download links rot
# silently: a dataset URL that starts 404ing is invisible until someone clicks it.
# The dev preview and the fonts are preconnected origins, so only real links are
# checked (see the exceptions in tests/links.spec.js).
#
# Weekly rather than per-pull-request: a host being briefly down should not block a
# documentation fix, and nothing about a code change can break an external link.
name: Link check

on:
  schedule:
    # Mondays, 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  links:
    name: Outgoing links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install tooling
        run: npm ci

      - name: Check every outgoing link
        id: links
        continue-on-error: true
        run: npm run test:links

      # One open issue, commented on rather than duplicated, so a stubborn dead link
      # does not accumulate a new issue every week.
      - name: Open or update an issue
        if: steps.links.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create link-check --color B60205 \
            --description "Reported by the scheduled link check" 2>/dev/null || true

          body=$(printf 'The scheduled link check found a link that no longer resolves.\n\nRun: %s/%s/actions/runs/%s\n\nRerun locally with `npm run test:links`.\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")

          existing=$(gh issue list --label link-check --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "A link on the page no longer resolves" \
              --body "$body" --label link-check
          fi

      - name: Fail the run when a link is broken
        if: steps.links.outcome == 'failure'
        run: exit 1
