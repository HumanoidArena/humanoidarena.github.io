# Publishes the project page to GitHub Pages.
#
# A repository has exactly one Pages site, so the two branches share a single
# artifact instead of fighting over the deployment:
#
#   main -> /        https://humanoidarena.github.io/
#   dev  -> /dev/    https://humanoidarena.github.io/dev/
#
# Every run rebuilds both halves from the branches as they currently stand, so
# pushing dev cannot blank production and pushing main cannot drop the preview.
#
# Actions are referenced by major version, not by commit SHA: `upload-pages-artifact` is a
# composite action that references `actions/upload-artifact@v4` internally, so it cannot run
# under a repository policy that requires SHA pinning.
name: Deploy static content to Pages

on:
  # Runs on pushes to either published branch
  push:
    branches: ["main", "dev"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: _site

      # Optional. A repository with no dev branch upstream still deploys, it
      # simply has nothing at /dev/.
      - name: Check out dev
        id: dev
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: dev
          path: _site/dev

      - name: Drop the preview when there is no dev branch
        if: steps.dev.outcome != 'success'
        run: |
          rm -rf _site/dev
          echo "::notice title=No dev branch upstream::publishing main only"

      # The marker script is taken from main's checkout rather than dev's, so a
      # half-finished dev branch cannot break the deploy.
      - name: Mark the preview
        if: steps.dev.outcome == 'success'
        run: python3 _site/.github/scripts/mark-dev-preview.py _site/dev/index.html

      # The tooling in package.json is for development only and never published.
      - name: Strip development files
        run: |
          rm -rf _site/.git _site/dev/.git
          for target in _site _site/dev; do
            rm -rf "$target/node_modules" "$target/tests" "$target/.github"
            rm -f "$target/package.json" "$target/package-lock.json" \
                  "$target/playwright.config.js" "$target/eslint.config.js"
          done

      - name: Check the artifact
        run: |
          test -f _site/index.html
          test -f _site/js/main.js
          test -f _site/css/components.css
          test ! -e _site/package.json
          echo "publishing $(find _site -type f | wc -l) files"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # main at the root, its dev preview nested under /dev/
          path: "_site"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
